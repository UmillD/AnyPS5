name: Validate readlink and fixture cleanup on Linux

on:
  push:
    branches: [validation/readlink-windows-cleanup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 libx11-dev libxext-dev libxrandr-dev libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Compile filesystem tests and dependencies
        run: cmake --build build --target filesystem_cleanup_tests guest_kernel_sys_tests guest_filesystem_tests guest_kernel_rename_tests guest_realpath_tests guest_path_case_tests --parallel 2
      - name: Repeat filesystem and path tests
        run: ctest --test-dir build -R '^(filesystem_cleanup|guest_kernel_sys|guest_filesystem|guest_kernel_rename|guest_realpath|guest_path_case)$' --repeat until-fail:3 --no-tests=error --output-on-failure --timeout 30 --output-log cleanup-linux.log --output-junit cleanup-linux.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-linux-results
          path: cleanup-linux.*
